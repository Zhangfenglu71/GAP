[metadata]
name = gap-radar-pose
version = 1.0.0
description = GAP modules and evaluation for radar-based absolute 3D joint localization
long_description = file: README.md
long_description_content_type = text/markdown
author = Fenglu Zhang, Yang Yang, Jianpu Liu
license = CC-BY-NC-4.0
license_files =
    LICENSE
    NOTICE

[options]
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.24
    torch>=2.1

[options.packages.find]
include = gap*

[options.package_data]
gap.vendor.videopose3d = LICENSE
